jobs:
  # ------------------------------------------------------------- Sweep
  # Replaces eoxs-sweep.timer. Same 2-hourly cadence as the systemd timer
  # it supersedes. Needs the identical credential set to eoxs-ingestion --
  # it runs the same fetchers, just on a schedule instead of on a webhook.
  #
  # IMPORTANT: do not run this while the droplet's eoxs-sweep.timer is also
  # enabled. Two schedulers writing the same tables is the parallel-write
  # problem that already required a merge once.
  - name: eoxs-sweep
    kind: SCHEDULED
    schedule:
      cron: "0 */2 * * *"
    github:
      repo: eoxssecondbrain/eoxs-wiki-db
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: python -m ingestion.server --sweep
    environment_slug: python
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: CLASSIFIER_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
