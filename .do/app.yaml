# DigitalOcean App Platform spec for eoxs-wiki-db.
#
# Import via: DO console -> Apps -> Create -> "Import from App Spec",
# or: doctl apps create --spec .do/app.yaml
#
# SECRETS ARE NOT IN THIS FILE, deliberately. Every value below marked
# type: SECRET with value "REPLACE_IN_CONSOLE" must be filled in from the
# DO console (or `doctl apps update`) after import -- never committed here.
# Non-secret values are checked in so the shape of the deployment is
# reviewable in git rather than living only in a web form.
#
# What this deploys (three components off one repo, NOT one app):
#   eoxs-mcp        web service  - customer-facing MCP connectors (SSE)
#   eoxs-ingestion  web service  - webhook receiver + health endpoint
#   eoxs-sweep      scheduled job - the 2-hourly raw-ingestion sweep
#
# What deliberately does NOT live here: eoxs-wiki-pipeline and
# eoxs-wiki-mcp. Those spawn `claude -p` subprocesses and need a real VPS,
# not a container platform -- they stay on the droplet. See
# docs/infrastructure-roadmap.md.

name: eoxs-services-sgp1
region: sgp

# Shared by every component. Postgres connection details for the managed
# cluster; PGSSLMODE=require because DO Managed Postgres refuses plaintext.
envs:
  - key: PGHOST
    scope: RUN_TIME
    value: private-eoxs-db-live-cluster-do-user-42137371-0.d.db.ondigitalocean.com
  - key: PGPORT
    scope: RUN_TIME
    value: "25060"
  - key: PGUSER
    scope: RUN_TIME
    value: eoxs_app
  - key: PGPASSWORD
    scope: RUN_TIME
    type: SECRET
    value: REPLACE_IN_CONSOLE
  - key: PGDATABASE
    scope: RUN_TIME
    value: eoxs_wiki
  - key: PGDATABASE_STAGING
    scope: RUN_TIME
    value: eoxs_wiki_staging
  - key: PGSSLMODE
    scope: RUN_TIME
    value: require

services:
  # ---------------------------------------------------------------- MCP
  # Reads the database and nothing else -- deliberately gets no Gmail,
  # Zoho, Odoo, Linear or webhook credentials. Each URL secret is the
  # credential for one identity (full/hr/general/intern/staging_qa); the
  # URL path itself is the auth, so these are as sensitive as passwords.
  - name: eoxs-mcp
    github:
      repo: eoxssecondbrain/eoxs-wiki-db
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: python -m mcp_server.http_server
    environment_slug: python
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8091
    routes:
      - path: /mcp
    health_check:
      # /health is an unauthenticated liveness route added for exactly this:
      # every other route here is scoped to a URL secret, and a platform probe
      # cannot be given one. Probing "/" instead returns 404, which App
      # Platform treats as unhealthy and kills the container.
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      failure_threshold: 5
    envs:
      - key: MCP_HTTP_PORT
        scope: RUN_TIME
        value: "8091"
      # App Platform's ingress matches prefix /mcp and strips it before
      # forwarding, so this process receives /<secret>/sse -- routes must be
      # registered with no prefix. The client must still be TOLD /mcp for its
      # message POSTs, since those go back through the same ingress.
      - key: MCP_MOUNT_PREFIX
        scope: RUN_TIME
        value: "none"
      - key: MCP_PUBLIC_PREFIX
        scope: RUN_TIME
        value: /mcp
      - key: MCP_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      # Required, not optional: http_server.py reads this with os.environ[...],
      # so the MCP server raises KeyError on startup if it is missing.
      # Added 2026-08-21 -- Ayan's own write-capable identity (mirrors `full`,
      # but stamps changed_by=ayan in the audit logs).
      - key: MCP_AYAN_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: MCP_HR_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: MCP_GENERAL_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: MCP_INTERN_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: MCP_STAGING_URL_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      # Read by mcp_server/redaction.py -- the query-time redaction safety
      # net runs for every identity except `full`, so this is required.
      - key: CLASSIFIER_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE

  # ---------------------------------------------------- Ingestion server
  # Webhook receiver. These URLs are called by EXTERNAL services (Gmail
  # Pub/Sub, Fireflies, Fathom) -- if this component's public URL changes,
  # those registrations must be updated or real-time ingestion silently
  # stops and the 2-hourly sweep masks it for up to two hours.
  - name: eoxs-ingestion
    github:
      repo: eoxssecondbrain/eoxs-wiki-db
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: python -m ingestion.server
    environment_slug: python
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8090
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      failure_threshold: 5
    envs:
      - key: INGESTION_SERVER_PORT
        scope: RUN_TIME
        value: "8090"
      # Must match whatever host actually serves the OAuth callbacks, and
      # that exact URI must be registered in the Google Cloud and Zoho
      # consoles or every new connect fails with redirect_uri_mismatch.
      - key: OAUTH_REDIRECT_BASE_URL
        scope: RUN_TIME
        value: https://mcp.askcruz.com
      - key: INGESTION_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: FIREFLIES_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: FATHOM_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: CLASSIFIER_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GMAIL_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GMAIL_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GMAIL_OAUTH_WEB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GMAIL_OAUTH_WEB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ZOHO_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ZOHO_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ZOHO_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ZOHO_WEB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ZOHO_WEB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      # Legacy per-account Gmail refresh tokens. Still read by
      # oauth_gmail.py's seed path for the three migrated accounts; the
      # DB-backed oauth_accounts table is the source of truth for anything
      # connected since 2026-08-12.
      - key: RAJ_GMAIL_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: RON_GMAIL_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: REMYA_GMAIL_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: FIREFLIES_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: RON_FATHOM_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      # NOTE: LINEAR_EDB_* are the ones the code actually reads. The
      # similarly-named LINEAR_API_KEY / LINEAR_TEAM_KEY in the old .env
      # are stale and unused -- do not carry them over.
      - key: LINEAR_EDB_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: LINEAR_EDB_TEAM_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GREER_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: GREER_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ESS_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: ESS_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: DPS_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: DPS_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: PPC_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: PPC_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: THREEGM_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: THREEGM_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: SABRE_ODOO_USERNAME
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: SABRE_ODOO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_CONSOLE
      - key: EOXS_TICKETS_ODOO_USERNAME
        scope: RUN_TIME
