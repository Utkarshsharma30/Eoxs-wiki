# LIVE config from the DigitalOcean box (Live-droplet, 68.183.181.25),
# captured 2026-08-24. Supersedes nginx-https.conf, which still carries the
# Hetzner IP and its short-lived IP certificate -- that file is NOT deployable
# here. See docs/backend-server-digitalocean.md §4.
#
# server_name carries three names deliberately: the real hostname
# (mcp.askcruz.com), the nip.io host, and the bare IP. One certificate covers
# the first two, so connector URLs saved against either keep working -- which
# is what makes repointing users a no-flag-day operation.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 68.183.181.25 68-183-181-25.nip.io mcp.askcruz.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 68.183.181.25 68-183-181-25.nip.io mcp.askcruz.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.askcruz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.askcruz.com/privkey.pem;

    location /mcp/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /threads/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /dbadmin/ {
        auth_basic "eoxs-wiki-db admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /dbadmin-staging/ {
        auth_basic "eoxs-wiki-db admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
