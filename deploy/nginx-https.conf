# Phase 2: HTTPS via the certbot-issued IP-address certificate, plus the
# same HTTP-01 challenge location (renewal reuses it every ~6 days) and an
# HTTP->HTTPS redirect for everything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 5.223.44.95;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 5.223.44.95;

    ssl_certificate     /etc/letsencrypt/live/5.223.44.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.223.44.95/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
