# Phase 2: HTTPS via the certbot-issued IP-address certificate, plus the
# same HTTP-01 challenge location (renewal reuses it every ~6 days) and an
# HTTP->HTTPS redirect for everything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 5.223.44.95;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 5.223.44.95;

    ssl_certificate     /etc/letsencrypt/live/5.223.44.95/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5.223.44.95/privkey.pem;

    # MCP server (SSE transport) -- SSE streaming needs buffering off and a
    # long read timeout, unlike the plain request/response ingestion API
    # below. proxy_pass has NO trailing slash/URI here deliberately: the
    # backend app builds its own self-referential "post messages to"
    # endpoint URL (sent to the client inside the SSE stream) with the
    # /mcp prefix already baked in (see mcp_server/http_server.py's
    # MOUNT_PREFIX), so nginx must pass the full original URI through
    # unchanged rather than stripping /mcp/ -- stripping it here breaks
    # the client's follow-up POST after a successful-looking SSE connect.
    location /mcp/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-08-18: eoxs-frontend-threads MCP server (separate repo/service,
    # same box), also SSE transport -- exact sibling of /mcp/ above, same
    # SSE-specific settings, same "don't strip the prefix" reasoning (that
    # service's own MOUNT_PREFIX = "/threads", see its mcp_server.py).
    location /threads/ {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Read-only database browser (pgweb), for visually inspecting every
    # row/table/relationship live -- see deploy/pgweb.service for the
    # read-only Postgres role + pgweb's own --readonly flag underneath this.
    # nginx basic auth is a THIRD, independent layer in front of both.
    location /dbadmin/ {
        auth_basic "eoxs-wiki-db admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        # Trailing slash on BOTH the location match and this proxy_pass value
        # is deliberate -- it makes nginx strip the /dbadmin/ prefix before
        # forwarding, so pgweb (run without --prefix, see pgweb.service) sees
        # a plain root-relative request. Found live: pgweb's --prefix flag
        # doesn't correctly serve its own static index route, only its API
        # routes, so prefixing on pgweb's side isn't usable here.
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2026-08-14: exact sibling of /dbadmin/ above, pointed at the SEPARATE
    # pgweb instance browsing eoxs_wiki_staging (deploy/pgweb-staging.service,
    # port 8095) instead of live -- added so staging_qa write-tool testing
    # (mcp_server/http_server.py) can be visually confirmed against the
    # actual rows, not just the tool's own returned JSON. Same auth_basic
    # credentials as /dbadmin/ -- same admin audience, same trust level.
    location /dbadmin-staging/ {
        auth_basic "eoxs-wiki-db admin";
        auth_basic_user_file /etc/nginx/.htpasswd_dbadmin;
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2026-08-12: additional server_name for the Gmail self-serve OAuth connect
# flow (ingestion/oauth_gmail.py). Google rejects raw IP literals as a Web
# application client's redirect_uri ("must end with a public top-level
# domain"), so /oauth/gmail/callback needs a real hostname -- nip.io's
# wildcard DNS (<ip>.nip.io always resolves to <ip>, no registration
# needed) is a zero-cost stand-in until a real domain exists (tracked in
# docs/infrastructure-roadmap.md). NOT default_server -- nginx picks this
# block only when the client's TLS SNI matches this server_name, so
# requests to the bare IP are completely unaffected and keep using the
# block above. Its cert is a separate, standard 90-day Let's Encrypt DV
# cert (HTTP-01, via the acme-challenge location already served on port 80
# above -- that block is default_server so it answers for this hostname
# too, no new port-80 config needed) -- notably a longer renewal cycle
# than the ~6-day IP-address cert profile the block above uses.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 5-223-44-95.nip.io;

    ssl_certificate     /etc/letsencrypt/live/5-223-44-95.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5-223-44-95.nip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
