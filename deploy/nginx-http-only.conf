# Phase 1: HTTP-only. Serves the ACME HTTP-01 challenge (needed to obtain
# the IP-address certificate) and proxies everything else to the ingestion
# server, so webhook endpoints work over plain HTTP in the brief window
# before the cert exists. Replaced by nginx-https.conf once certbot has
# issued a certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 5.223.44.95;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
