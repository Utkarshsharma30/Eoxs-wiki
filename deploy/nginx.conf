user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	##
	# Security headers (apex hardening 2026-08-15) -- http-level, inherited
	# by both 443 server blocks (neither sets its own add_header).
	##
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Strict-Transport-Security "max-age=63072000" always;

	##
	# Mask the MCP connector secret (the path segment after /mcp/) so it
	# never lands in access.log. Uses $uri (path only, no query string).
	##
	map $uri $mcp_safe_uri {
		~^/mcp/  "/mcp/[REDACTED]";
		default  $uri;
	}
	log_format masked '$remote_addr - $remote_user [$time_local] '
	                  '"$request_method $mcp_safe_uri $server_protocol" '
	                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # apex 2026-08-15: dropped TLSv1/1.1 (weak)
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log masked;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
